 const cellK=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.dataset&&el.dataset.k};
 const paint=(k,v)=>setS(o=>({...o,av:{...o.av,[k]:v}}));
 const cp=i=>setS(o=>{const av={...o.av};for(let j=0;j<7;j++)HRS.forEach(x=>{av[`${j}-${x}`]=o.av[`${i}-${x}`]!==false});return{...o,av}});
 const rd=gd.rd;
 return h`<div className="max-w-md mx-auto px-4 pt-5">
 <div className="mu text-xs uppercase tracking-widest">${s.raceName||"Ironman"}</div>
 ${tab=="hoje"&&h`<div className="space-y-4 mt-2"><${Btn}/>
  <div className="hero"><div className="text-xs opacity-80 uppercase tracking-widest">${s.raceName}</div><div className="text-5xl font-extrabold mt-1">${s.raceDate?wl:"—"}<span className="text-base font-medium"> semanas</span></div><div className="text-sm opacity-90">${w?`Fase ${w.p} · semana ${plan[cw].n} de ${plan.length}`:"Define a data da prova em Definições"}</div></div>
  ${rd&&h`<div className="cd flex items-center gap-4"><${Ring} v=${rd.score}/><div><div className="font-medium">Prontidão: ${LV[rd.level]||rd.level}</div><div className="mu text-xs">Recuperação restante: ${Math.round(rd.recovery_time_hours)} h · HRV semanal ${rd.hrv_weekly_avg}</div></div></div>`}
  <div><div className="text-sm font-medium mb-2">Hoje</div>${td?(()=>{const sl=slots(tdi,td,s.av);return td.map((x,i)=>h`<${Sess} key=${i} s=${x} t=${sl[i]} k=${`${plan[cw].n}-${tdi}-${i}`}/>`)})():h`<div className="mu text-sm">Sem plano ainda.</div>`}</div></div>`}
 ${tab=="plano"&&h`<div className="space-y-2 mt-2">${w?h`<div className="flex items-center justify-between"><button className="p-2" onClick=${()=>setWi(Math.max(0,(wi??cw)-1))}>‹</button><div className="text-center"><div className="font-semibold">Semana ${w.n}</div><div className="mu text-xs">${w.st.toLocaleDateString("pt-PT",{day:"2-digit",month:"short"})} · ${w.p}${w.cut?" · recuperação":""}</div></div><button className="p-2" onClick=${()=>setWi(Math.min(plan.length-1,(wi??cw)+1))}>›</button></div>
  ${w.D.map((d,i)=>{const sl=slots(i,d,s.av);return h`<div key=${i}><div className="mu text-[10px] uppercase mb-1">${DAYS[i]}</div>${d.map((x,j)=>h`<${Sess} key=${j} s=${x} t=${sl[j]} k=${`${w.n}-${i}-${j}`}/>`)}</div>`})}`:h`<div className="cd mu text-sm">Define a data da prova em Definições para gerar o plano.</div>`}</div>`}
 ${tab=="saude"&&h`<div className="space-y-4 mt-2"><${Btn}/>
  ${er.r&&h`<div className="text-sm" style=${{color:"var(--no)"}}>Prontidão: ${er.r}</div>`}
  ${rd?h`<div className="cd flex items-center gap-4"><${Ring} v=${rd.score}/><div className="text-sm space-y-0.5"><div className="font-medium">Prontidão: ${LV[rd.level]||rd.level}</div><div className="mu">Sono ${rd.sleep_score??"–"} · HRV ${rd.hrv_factor_percent}% · Carga aguda ${rd.acute_load}</div><div className="mu">Recuperação restante ${Math.round(rd.recovery_time_hours)} h</div></div></div>`:h`<div className="cd mu text-sm">Carrega em atualizar para ver a prontidão.</div>`}
  ${er.s&&h`<div className="text-sm" style=${{color:"var(--no)"}}>Sono: ${er.s}</div>`}
  ${gd.sleep&&h`<div className="cd"><div className="text-sm font-medium mb-2">Sono (últimas noites)</div>${gd.sleep.length?gd.sleep.map(n=>h`<div key=${n.date} className="flex items-center gap-2 text-xs mb-1"><span className="w-12 mu">${n.date.slice(5)}</span><div className="flex-1 h-3 rounded" style=${{background:"var(--bd)"}}><div className="h-3 rounded" style=${{width:`${Math.min(100,n.sleep_hours/10*100)}%`,background:"var(--ac)"}}></div></div><span className="w-28 text-right">${n.sleep_hours.toFixed(1)} h · ${n.sleep_score??"–"} · HRV ${n.avg_overnight_hrv??"–"}</span></div>`):h`<div className="mu text-xs">Sem noites registadas.</div>`}<div className="mu text-[11px] mt-1">Noites sem dados do Garmin não aparecem.</div></div>`}
  ${er.a&&h`<div className="text-sm" style=${{color:"var(--no)"}}>Atividades: ${er.a}</div>`}
  ${gd.act&&h`<div className="cd"><div className="text-sm font-medium mb-2">Últimas atividades</div>${gd.act.slice(0,12).map(a=>h`<div key=${a.id} className="flex justify-between text-xs mb-1.5 gap-2"><span>${a.start_time.slice(5,10)} · ${typ(a.type)}</span><span className="mu text-right">${ln(a)}${a.avg_hr_bpm?` · ${Math.round(a.avg_hr_bpm)} bpm`:""}</span></div>`)}</div>`}</div>`}
 ${tab=="comer"&&h`<div className="space-y-3 mt-2"><div className="hero"><div className="text-xs opacity-80 uppercase tracking-widest">Alimentação de hoje</div><div className="text-2xl font-extrabold mt-1">${tm==0?"Dia de descanso":tm<60?"Dia leve":tm<150?"Dia moderado":"Dia longo / chave"}</div><div className="text-sm opacity-90">${tm?`${fm(tm)} de treino`:"Sem treino planeado"}${rd?` · prontidão ${rd.score}`:""}</div></div>${pw?h`<${React.Fragment}><div className="grid grid-cols-3 gap-2 text-center">${[["Hidratos",`${R(cb[0]*pw)}–${R(cb[1]*pw)} g`,`${cb[0]}–${cb[1]} g/kg`],["Proteína",`${R(1.6*pw)}–${R(1.8*pw)} g`,"1,6–1,8 g/kg"],["Gordura",`${R(pw)} g`,"≈1 g/kg"]].map(([a,b,c])=>h`<div key=${a} className="cd"><div className="font-bold">${b}</div><div className="mu text-[10px]">${a} · ${c}</div></div>`)}</div>${rd&&rd.score<60&&h`<div className="cd text-sm">A prontidão está baixa: reforça a proteína e a hidratação e come bem ao jantar.</div>`}${meals.map(([a,b])=>h`<div key=${a} className="cd"><div className="text-xs font-semibold uppercase mu">${a}</div><div className="text-sm mt-1">${b}</div></div>`)}<//>`:h`<div className="cd mu text-sm">Define o teu peso em Definições › Corpo para calcular o plano.</div>`}<div className="mu text-[11px]">Referência geral baseada no treino de hoje e no teu peso. Ajusta a alergias e preferências; não substitui um nutricionista.</div></div>`}
 ${tab=="def"&&h`<div className="mt-2">
  <${Sec} id="p" t="Prova e data" open=${op} set=${setOp}>
   <${Fld} l="Título da prova" v=${s.raceName} on=${v=>up("raceName",v)}/><${Fld} l="Data da prova" t="date" v=${s.raceDate} on=${v=>up("raceDate",v)}/>
   ${["swim","bike","run"].map(k=>h`<div key=${k} className="text-xs"><div className="mu mb-1">Percurso — ${NM[k]} (GPX)</div><input type="file" accept=".gpx" onChange=${async e=>{const f=e.target.files[0];if(f)sub("gpx",k,{nome:f.name,...gpx(await f.text())})}}/>${s.gpx[k]&&h`<div className="mu mt-1">${s.gpx[k].nome}: ${s.gpx[k].km} km${s.gpx[k].gain!=null?` · +${s.gpx[k].gain} m`:" · sem altitude no ficheiro"}</div>`}</div>`)}
  <//>
  <${Sec} id="d" t="Disponibilidades" open=${op} set=${setOp}>
   <div className="mu text-xs">Toca ou arrasta para alternar. Verde = disponível, vermelho = indisponível. O botão ⎘ copia o dia para todos.</div>
   <div className="grid gap-1 select-none" style=${{gridTemplateColumns:"30px repeat(7,1fr)",touchAction:"none"}} onPointerDown=${e=>{const k=cellK(e);if(!k)return;const v=!(s.av[k]!==false);dr.current=v;paint(k,v)}} onPointerMove=${e=>{if(dr.current===null)return;const k=cellK(e);if(k)paint(k,dr.current)}} onPointerUp=${()=>dr.current=null} onPointerLeave=${()=>dr.current=null}>
    <div></div>${DAYS.map((d,i)=>h`<button key=${d} className="text-[11px]" onPointerDown=${e=>e.stopPropagation()} onClick=${()=>cp(i)}>${d} ⎘</button>`)}
    ${HRS.map(x=>h`<${React.Fragment} key=${x}><div className="mu text-[10px] text-right pr-1">${x}h</div>${DAYS.map((d,i)=>h`<div key=${i} className="cell" data-k=${`${i}-${x}`} style=${{background:s.av[`${i}-${x}`]===false?"var(--no)":"var(--ok)"}}></div>`)}<//>`)}
   </div>
  <//>
  <${Sec} id="o" t="Objetivo" open=${op} set=${setOp}>
   <${Fld} l="Natação — ritmo por 100 m (m:ss)" v=${s.goal.swim} on=${v=>sub("goal","swim",v)}/><${Fld} l="Bike — velocidade (km/h)" t="number" v=${s.goal.bike} on=${v=>sub("goal","bike",v)}/><${Fld} l="Corrida — ritmo por km (m:ss)" v=${s.goal.run} on=${v=>sub("goal","run",v)}/>
   <div className="cd text-sm"><div className="text-2xl font-mono font-bold">${fm(goal)}</div><div className="mu text-xs">Natação ${fm(pp(s.goal.swim)*38)} · Bike ${fm(180/(+s.goal.bike||1)*60)} · Corrida ${fm(pp(s.goal.run)*42.195)} · T1 e T2: 3 min cada</div></div>
  <//>
  <${Sec} id="c" t="Corpo" open=${op} set=${setOp}>
   ${[["peso","Peso (kg)"],["altura","Altura (cm)"],["idade","Idade"],["fcmax","FC máxima (bpm)"],["gordura","Massa gorda (%)"],["ftp","FTP na bike (W)"]].map(([k,l])=>h`<${Fld} key=${k} l=${l} t="number" v=${s.body[k]} on=${v=>sub("body",k,v)}/>`)}
   <div className="mu text-xs">Do Garmin: HRV semanal ${rd?rd.hrv_weekly_avg:"–"} · HRV da última noite ${gd.sleep&&gd.sleep.length?gd.sleep[gd.sleep.length-1].avg_overnight_hrv:"–"}. FC em repouso, VO2 máx. e ritmos de limiar ligam-se na fase seguinte.</div>
  <//>
  <${Sec} id="t" t="Avaliações técnicas" open=${op} set=${setOp}>
   ${Object.keys(SK).map(d=>h`<div key=${d}><div className="text-sm font-medium mb-1">${NM[d]}</div>${SK[d].map(l=>h`<div key=${l} className="flex items-center justify-between mb-1"><span className="text-xs mu flex-1">${l}</span><div className="flex gap-1">${[1,2,3,4,5].map(v=>h`<button key=${v} className="w-7 h-7 rounded-full text-xs border" style=${{borderColor:"var(--bd)",background:(s.sk[d+l]??3)==v?"var(--ac)":"transparent",color:(s.sk[d+l]??3)==v?"#0c0a09":"var(--mu)"}} onClick=${()=>sub("sk",d+l,v)}>${v}</button>`)}</div></div>`)}</div>`)}
   <div className="mu text-[11px]">1 = ponto fraco · 5 = ponto forte.</div>
  <//></div>`}
 ${sel&&h`<${Det} q=${sel} fc=${+s.body.fcmax||0} goal=${s.goal} lg=${lg} setLg=${setLg} close=${()=>setSel(null)}/>`}<nav>${[["hoje","🏠","Hoje"],["plano","📅","Plano"],["saude","❤️","Saúde"],["comer","🍽️","Comida"],["def","⚙️","Definições"]].map(([k,i,l])=>h`<button key=${k} onClick=${()=>setTab(k)} style=${{color:tab==k?"var(--ac)":"var(--mu)"}}><div className="text-lg">${i}</div><div>${l}</div></button>`)}</nav></div>`
}
ReactDOM.createRoot(document.getElementById("root")).render(h`<${App}/>`);
</script></body></html>
